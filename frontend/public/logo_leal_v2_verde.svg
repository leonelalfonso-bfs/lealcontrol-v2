<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none" width="800" height="240">
  <defs>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399"/>
      <stop offset="50%" stopColor="#10b981"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>
    <linearGradient id="cyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#06b6d4"/>
      <stop offset="100%" stopColor="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background transparent card -->
  <rect x="0" y="0" width="400" height="120" rx="20" fill="transparent"/>

  <!-- Logo Isotype Emblem -->
  <g transform="translate(15, 12)">
    <rect x="4" y="4" width="88" height="88" rx="24" fill="#064e3b" fill-opacity="0.1" stroke="url(#emGrad)" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="48" cy="48" r="36" fill="#10b981" fill-opacity="0.12" filter="url(#glow)"/>
    <circle cx="48" cy="48" r="36" fill="none" stroke="url(#cyGrad)" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.65"/>
    
    <!-- L + C Monogram -->
    <path d="M26 24 C26 21.79 27.79 20 30 20 H34 C36.21 20 38 21.79 38 24 V58 H64 C66.21 58 68 59.79 68 62 V66 C68 68.21 66.21 70 64 70 H30 C27.79 70 26 68.21 26 66 V24 Z" fill="url(#emGrad)" filter="url(#glow)"/>
    <path d="M48 30 C60 30 70 38 70 50 C70 52.21 68.21 54 66 54 C63.79 54 62 52.21 62 50 C62 42.27 55.73 36 48 36 C40.27 36 34 42.27 34 50 C34 52.21 32.21 54 30 54 C27.79 54 26 52.21 26 50 C26 38 36 30 48 30 Z" fill="url(#cyGrad)" opacity="0.95"/>
    <circle cx="64" cy="34" r="6" fill="#34d399" filter="url(#glow)"/>
    <circle cx="64" cy="34" r="2.8" fill="#ffffff"/>
  </g>

  <!-- Typography LEAL v2.0 Control ERP -->
  <g transform="translate(125, 28)">
    <text x="0" y="38" font-family="Inter, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#10b981" letter-spacing="-1">LEAL</text>
    
    <!-- v2.0 Badge -->
    <rect x="106" y="14" width="58" height="26" rx="8" fill="url(#emGrad)"/>
    <text x="135" y="32" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">v2.0</text>
    
    <!-- Subtitle -->
    <text x="2" y="60" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#64748b" letter-spacing="2">CONTROL ERP</text>
  </g>
</svg>
