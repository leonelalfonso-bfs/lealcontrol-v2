# Conexiones persistentes al API: evita abrir un TCP nuevo por cada request.
upstream leal_api {
  server api:8080;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 50M;
  root /usr/share/nginx/html;

  # Compresión: el bundle inicial (JS + CSS) baja de ~440 KB a ~115 KB.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/problem+json
    application/xml image/svg+xml font/ttf font/otf;

  # Cabeceras de seguridad HTTP
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

  # Modules ES (.mjs): con nosniff el browser exige MIME correcto.
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  # Assets hasheados: nunca devolver index.html (rompe import() dinámico).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /api/ {
    proxy_pass http://leal_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 50M;
  }

  # index.html sin caché: cada deploy llega al instante y no apunta a chunks borrados.
  # (add_header en un location reemplaza los del server: se repiten las de seguridad.)
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  }

  location / { try_files $uri $uri/ /index.html; }
}
