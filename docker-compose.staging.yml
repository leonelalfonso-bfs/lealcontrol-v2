services:
  postgres:
    image: postgres:16-alpine
    container_name: lealcontrol-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lealcontrol_staging}
      POSTGRES_USER: ${POSTGRES_USER:-leal_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leal_staging_secret}
    volumes:
      - lealcontrol_staging_pg:/var/lib/postgresql/data
    networks: [staging]

  api:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    container_name: lealcontrol-staging-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lealcontrol_staging};Username=${POSTGRES_USER:-leal_staging};Password=${POSTGRES_PASSWORD:-leal_staging_secret}
      WhatsAppGateway__Url: http://whatsapp-gateway:8080
      WhatsAppGateway__ApiKey: ${EVOLUTION_API_KEY:-lealcontrol_wa_master_key_2026}
    depends_on: [postgres]
    ports: ["127.0.0.1:5210:8080"]
    networks: [staging]

  whatsapp-gateway:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: lealcontrol-staging-wa-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SERVER_URL: http://whatsapp-gateway:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-lealcontrol_wa_master_key_2026}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "false"
      DEL_INSTANCE: "false"
      WEBHOOK_GLOBAL_URL: http://api:8080/api/communications/whatsapp/webhook
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
    volumes:
      - lealcontrol_staging_wa_instances:/evolution/instances
    networks: [staging]

  web:
    build: { context: ., dockerfile: deploy/Dockerfile.web }
    container_name: lealcontrol-staging-web
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:5175:80"]
    networks: [staging]

networks:
  staging: { name: lealcontrol-staging }

volumes:
  lealcontrol_staging_pg: { name: lealcontrol-staging-pg }
  lealcontrol_staging_wa_instances: { name: lealcontrol-staging-wa-instances }
