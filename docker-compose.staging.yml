# Pruebas: https://v2.lealcontrol.com
# Carpeta en el VPS: /opt/lealcontrol-staging
# Puertos: web 5175, api 5210. Rama git: staging.
services:
  postgres:
    image: postgres:16-alpine
    container_name: lealcontrol-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lealcontrol_staging}
      POSTGRES_USER: ${POSTGRES_USER:-leal_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - lealcontrol_staging_pg:/var/lib/postgresql/data
    networks: [staging]

  api:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    container_name: lealcontrol-staging-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lealcontrol_staging};Username=${POSTGRES_USER:-leal_staging};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: ${Jwt__Issuer:-lealcontrol}
      Jwt__Audience: ${Jwt__Audience:-lealcontrol-web}
      Jwt__LifetimeHours: ${Jwt__LifetimeHours:-8}
      Cors__Origins__0: ${PUBLIC_WEB_ORIGIN:?PUBLIC_WEB_ORIGIN is required}
      WhatsAppGateway__Url: ${WHATSAPP_GATEWAY_URL:-http://evolution-api-evolution-api-1:8080}
      WhatsAppGateway__ApiKey: ${WHATSAPP_GATEWAY_APIKEY:?WHATSAPP_GATEWAY_APIKEY is required}
      WhatsAppGateway__WebhookUrl: ${WHATSAPP_GATEWAY_WEBHOOK_URL:-}
      WhatsAppGateway__WebhookSecret: ${WHATSAPP_WEBHOOK_SECRET:?WHATSAPP_WEBHOOK_SECRET is required}
      Meta__VerifyToken: ${Meta__VerifyToken:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      SUPERADMIN_BOOTSTRAP_PASSWORD: ${SUPERADMIN_BOOTSTRAP_PASSWORD:-}
      SUPERADMIN_BOOTSTRAP_EMAIL: ${SUPERADMIN_BOOTSTRAP_EMAIL:-}
    depends_on: [postgres]
    volumes:
      - lealcontrol_staging_dp_keys:/root/.aspnet/DataProtection-Keys
    ports: ["127.0.0.1:5210:8080"]
    networks: [staging, evolution_net]

  web:
    build: { context: ., dockerfile: deploy/Dockerfile.web }
    container_name: lealcontrol-staging-web
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:5175:80"]
    networks: [staging]

networks:
  staging: { name: lealcontrol-staging }
  evolution_net:
    name: evolution-api_default
    external: true

volumes:
  lealcontrol_staging_pg: { name: lealcontrol-staging-pg }
  lealcontrol_staging_dp_keys: { name: lealcontrol-staging-dp-keys }
