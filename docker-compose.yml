services:
  postgres:
    image: postgres:16-alpine
    container_name: lealcontrol-postgres
    environment:
      POSTGRES_USER: leal
      POSTGRES_PASSWORD: leal
      POSTGRES_DB: lealcontrol
    ports:
      - "5432:5432"
    volumes:
      - lealcontrol_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leal -d lealcontrol"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lealcontrol_pg:
